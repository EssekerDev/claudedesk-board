name: fetch glass

on:
  push:
    paths:
      - .github/workflows/fetch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Fetch the glass
        run: |
          set -euo pipefail
          base=https://dash-estate-flush-sterling.trycloudflare.com
          for f in index.html app.css app.js desk.js desk.wasm; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$base/$f" -o "$f"
          done
          echo "90dbd7dd449886919d0b61c5d0aed680a03dfeae  desk.wasm" | sha1sum -c -
          test "$(wc -c < desk.wasm)" -eq 136072
          python3 - << 'PY'
          css = open("app.css").read()
          i = css.find("#glass")
          block = css[i:css.find("}", i)]
          assert "border-radius" not in block, block
          assert "aspect-ratio" in block
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css app.js desk.js desk.wasm
          git diff --cached --quiet && exit 0
          git commit -m "Publish the animated glass"
          git push
